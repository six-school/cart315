name: Build Godot
description: Export a Godot project for web

inputs:
  project:
    description: Path to the project folder
    required: true

runs:
  using: composite
  steps:
    - name: Read Godot version
      shell: bash
      working-directory: ${{ inputs.project }}
      run: echo "GODOT_VERSION=$(cat .godot-version)" >> "$GITHUB_ENV"
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v5
      with:
        path: ~/godot
        key: godot-${{ env.GODOT_VERSION }}-web
    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
        mkdir -p ~/godot/templates
        cd ~/godot
        curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o editor.zip
        unzip -q editor.zip
        mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
        rm editor.zip
        curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
        unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d templates
        rm templates.tpz
    - name: Install export templates
      shell: bash
      run: |
        templates_root="$HOME/.local/share/godot/export_templates"
        mkdir -p "$templates_root"
        ln -sfn ~/godot/templates "$templates_root/${GODOT_VERSION/-/.}"
    - name: Export
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        ~/godot/godot --headless --path . --import
        mkdir -p export/_site
        ~/godot/godot --headless --path . --export-release "Web" export/_site/index.html
